<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Sign in | Fitness Music Player</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/access.css">
  <script type="module" src="/signin.js"></script>
</head>
<body>
  <main class="access-page">
    <header class="access-brand"><img src="/icon-192.png" alt="" width="40" height="40"><span>Fitness Music Player</span></header>
    <p class="access-label">HOUSEHOLD ACCESS</p>
    <h1>Sign in</h1>
    <form id="signin-form" class="access-form" action="/api/auth/login" method="post">
      <label for="signin-username">Username</label>
      <input id="signin-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="signin-password">Password</label>
      <input id="signin-password" name="password" type="password" autocomplete="current-password" required>
      <button id="signin-submit" class="access-action" type="submit" aria-describedby="signin-status" disabled>Sign in</button>
      <p id="signin-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
    <a id="signin-cleanup" class="access-link" href="/signout.html" hidden>Finish sign out</a>
    <noscript><p class="access-error">JavaScript is required to sign in.</p></noscript>
  </main>
</body>
</html>
