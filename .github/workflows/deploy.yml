name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Install separate locked dependencies
        run: |
          npm install --global npm@11.19.1 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix api ci --ignore-scripts --no-audit --no-fund
      - name: Build hosted frontend
        env:
          VITE_HOSTED_PILOT: 'true'
        run: npm run build
      - name: Stage production API bundle
        run: |
          export NPM_CLI="$(readlink -f "$(command -v npm)")"
          node infra/stage.mjs
      - name: Check privacy of the built artifacts
        run: npm run check:privacy
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          api_location: local-media/deployment/api
          skip_app_build: true
          skip_api_build: true
          production_branch: master
