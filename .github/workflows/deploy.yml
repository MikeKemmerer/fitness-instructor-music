name: Deploy

# Split deploy topology: the frontend (static files only) deploys to the Static Web App via
# the pinned SWA CLI -- this path has been reliable in this session's real-world testing. The
# API deploys separately to a standalone Azure Function App (fitness-instructor-music-pilot2-api)
# via the standard `az functionapp` zip-deploy mechanism, authenticated via OIDC (no long-lived
# secret). This replaces SWA's bundled/managed Functions deploy path, which failed 100% of the
# time in this session's testing (5+ real attempts; environment gate removed, artifact bloat
# fixed, both the original and a brand-new SWA resource tried) with an opaque "Failed to deploy
# the Azure Functions" error and zero actionable server-side diagnostics (AppLens and Resource
# Health don't support the staticSites resource type; Activity Log doesn't capture the SWA CLI's
# token-based upload channel). The standalone Function App is a real Microsoft.Web/sites
# resource, which both of those diagnostic tools DO support, going forward.
#
# The frontend and API are on different origins by design (SWA Free tier does not support
# linked/BYO backends, which require the Standard tier). Cross-origin auth is handled via
# SameSite=None session cookies, a relaxed (but still Origin-header-checked) CSRF/Fetch-Metadata
# check, CORS with credentials on the Function App, and a relaxed connect-src CSP.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VITE_HOSTED_PILOT: 'true'
  VITE_API_ORIGIN: 'https://fitness-instructor-music-pilot2-api.azurewebsites.net'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install separate locked dependencies
        run: |
          npm install --global npm@11.19.1 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix api ci --ignore-scripts --no-audit --no-fund
      - name: Build hosted frontend
        run: npm run build
      - name: Stage production API bundle
        run: |
          export NPM_CLI="$(readlink -f "$(command -v npm)")"
          node infra/stage.mjs
      - name: Check privacy of the built artifacts
        run: npm run check:privacy
      - name: Install pinned SWA CLI
        run: npm install --global @azure/static-web-apps-cli@2.0.10
      - name: Deploy frontend to Azure Static Web Apps
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          SWA_CLI_DEBUG: 'log'
        run: |
          swa deploy frontend/dist \
            --app-location frontend/dist \
            --swa-config-location frontend/dist \
            --env production \
            --no-use-keychain \
            --verbose log
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Zip the staged API artifact
        run: (cd local-media/deployment/api && zip -rq /tmp/api-deploy.zip .)
      - name: Deploy API to the standalone Function App
        run: |
          az functionapp deployment source config-zip \
            --name fitness-instructor-music-pilot2-api \
            --resource-group rg-fitness-instructor-pilot \
            --src /tmp/api-deploy.zip
      - run: az logout
        if: always()

      - name: Fail if deploy failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
