name: Deploy

# Manual-dispatch only. The original resource (fitness-instructor-music-pilot) had a
# server-side "Failed to deploy the Azure Functions" fault isolated (2026-09-20) to that
# specific resource's own internal state -- confirmed via two controlled experiments
# (a trivial app AND the real production bundle both deployed successfully from GitHub
# Actions to fresh disposable SWA resources, ruling out GH Actions/network/Node-version/
# app-content causes). Production now targets a replacement resource,
# fitness-instructor-music-pilot2, with identical app settings (same storage account/
# container and FIM_ACCOUNTS_JSON, so the same songs/routines/accounts are visible with
# no data migration needed) and a new hostname.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install separate locked dependencies
        run: |
          npm install --global npm@11.19.1 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix api ci --ignore-scripts --no-audit --no-fund
      - name: Build hosted frontend
        env:
          VITE_HOSTED_PILOT: 'true'
        run: npm run build
      - name: Stage production API bundle
        run: |
          export NPM_CLI="$(readlink -f "$(command -v npm)")"
          node infra/stage.mjs
      - name: Check privacy of the built artifacts
        run: npm run check:privacy
      - name: Install pinned SWA CLI
        run: npm install --global @azure/static-web-apps-cli@2.0.10
      - name: Deploy to Azure Static Web Apps
        id: deploy
        continue-on-error: true
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          SWA_CLI_DEBUG: 'log'
        run: |
          swa deploy frontend/dist \
            --app-location frontend/dist \
            --swa-config-location frontend/dist \
            --api-location local-media/deployment/api \
            --api-language node \
            --api-version 22 \
            --env production \
            --no-use-keychain \
            --verbose log
      - name: Diagnose native StaticSitesClient failure
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "--- StaticSitesClient binaries found ---"
          find "$HOME/.swa" -maxdepth 4 -iname 'StaticSitesClient*' -print
          for bin in $(find "$HOME/.swa" -maxdepth 4 -iname 'StaticSitesClient' -type f); do
            echo "--- ldd: $bin ---"
            ldd "$bin" || true
            echo "--- file: $bin ---"
            file "$bin" || true
          done
          echo "--- OS release ---"
          cat /etc/os-release
      - name: Fail if deploy failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
