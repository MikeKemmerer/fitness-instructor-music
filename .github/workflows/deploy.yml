name: Deploy

# Manual-dispatch only. The push-to-master trigger is disabled: this workflow's
# "Deploy to Azure Static Web Apps" step (both via the official wrapper action and via
# the pinned SWA CLI directly) fails server-side with "Failed to deploy the Azure
# Functions" when run from GitHub-hosted Actions runners against this SWA resource --
# confirmed not a build/staging/CLI-version/missing-shared-library issue (ldd is clean).
# Root cause unconfirmed (possibly network/IP-based rejection, possibly this
# resource's `Provider: SwaCli` origin). Production deploys still go through the
# proven manual pipeline (infra/deploy.mjs) until this is investigated further.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Install separate locked dependencies
        run: |
          npm install --global npm@11.19.1 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix api ci --ignore-scripts --no-audit --no-fund
      - name: Build hosted frontend
        env:
          VITE_HOSTED_PILOT: 'true'
        run: npm run build
      - name: Stage production API bundle
        run: |
          export NPM_CLI="$(readlink -f "$(command -v npm)")"
          node infra/stage.mjs
      - name: Check privacy of the built artifacts
        run: npm run check:privacy
      - name: Install pinned SWA CLI
        run: npm install --global @azure/static-web-apps-cli@2.0.10
      - name: Deploy to Azure Static Web Apps
        id: deploy
        continue-on-error: true
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          SWA_CLI_DEBUG: 'log'
        run: |
          swa deploy frontend/dist \
            --app-location frontend/dist \
            --swa-config-location frontend/dist \
            --api-location local-media/deployment/api \
            --api-language node \
            --api-version 22 \
            --env production \
            --no-use-keychain \
            --verbose log
      - name: Diagnose native StaticSitesClient failure
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "--- StaticSitesClient binaries found ---"
          find "$HOME/.swa" -maxdepth 4 -iname 'StaticSitesClient*' -print
          for bin in $(find "$HOME/.swa" -maxdepth 4 -iname 'StaticSitesClient' -type f); do
            echo "--- ldd: $bin ---"
            ldd "$bin" || true
            echo "--- file: $bin ---"
            file "$bin" || true
          done
          echo "--- OS release ---"
          cat /etc/os-release
      - name: Fail if deploy failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
