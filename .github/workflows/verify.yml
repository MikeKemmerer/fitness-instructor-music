name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=2048
      UV_THREADPOOL_SIZE: '2'
      VITE_HOSTED_PILOT: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Install separate locked dependencies
        run: |
          npm install --global npm@11.19.1 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix api ci --ignore-scripts --no-audit --no-fund
      - name: Install synthetic browser and codec prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify fresh local and isolated hosted artifacts
        run: |
          export NPM_CLI="$(readlink -f "$(command -v npm)")"
          flock /tmp/fim-unified-check.lock node infra/verify-azure-only.mjs --ci
      - name: Upload allowlisted synthetic evidence
        if: ${{ always() && hashFiles('.ci-reports/summary.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-verification-${{ github.sha }}
          path: |
            .ci-reports/summary.json
            .ci-reports/screenshots/*.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6